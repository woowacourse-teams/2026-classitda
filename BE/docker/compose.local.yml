name: be

services:
  app:
    container_name: be-app
    image: classitda-server:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/classitda?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia%2FSeoul"
      SPRING_DATASOURCE_USERNAME: classitda
      SPRING_DATASOURCE_PASSWORD: classitda
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      IMAGE_BUCKET: ${IMAGE_BUCKET}
      IMAGE_KEY_PREFIX: ${IMAGE_KEY_PREFIX}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}
      IMAGE_REGION: ${IMAGE_REGION}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true

  mysql:
    container_name: be-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: classitda
      MYSQL_USER: classitda
      MYSQL_PASSWORD: classitda
      MYSQL_ROOT_PASSWORD: classitda-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: be-redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
