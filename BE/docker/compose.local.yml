name: be

services:
  app:
    container_name: be-app
    image: classitda-server:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      LOCAL_DB_HOST: mysql
      LOCAL_DB_PORT: 3306
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-classitda}
      LOCAL_DB_USERNAME: ${LOCAL_DB_USERNAME:-classitda}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-classitda}
    ports:
      - "${LOCAL_APP_BIND_ADDRESS:-127.0.0.1}:${LOCAL_APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    init: true

  mysql:
    container_name: be-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-classitda}
      MYSQL_USER: ${LOCAL_DB_USERNAME:-classitda}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-classitda}
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-classitda-root}
    ports:
      - "${LOCAL_DB_BIND_ADDRESS:-127.0.0.1}:${LOCAL_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
