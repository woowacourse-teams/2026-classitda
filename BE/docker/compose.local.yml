name: be

services:
  app:
    container_name: be-app
    image: classitda-server:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/classitda?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia%2FSeoul"
      SPRING_DATASOURCE_USERNAME: classitda
      SPRING_DATASOURCE_PASSWORD: classitda
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    init: true

  mysql:
    container_name: be-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: classitda
      MYSQL_USER: classitda
      MYSQL_PASSWORD: classitda
      MYSQL_ROOT_PASSWORD: classitda-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
