name: classitda-dev

services:
  nginx:
    container_name: classitda-dev-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./nginx/api-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    init: true

  app:
    container_name: classitda-dev-app
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: classitda
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: "false"

      GOOGLE_OAUTH_WEB_CLIENT_ID: ${GOOGLE_OAUTH_WEB_CLIENT_ID:?}
      GOOGLE_OAUTH_IOS_CLIENT_ID: ${GOOGLE_OAUTH_IOS_CLIENT_ID:?}
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64:?}
      AUTH_JWT_PUBLIC_KEY_BASE64: ${AUTH_JWT_PUBLIC_KEY_BASE64:?}
      AUTH_PHONE_KEY_HMAC_SECRET_BASE64: ${AUTH_PHONE_KEY_HMAC_SECRET_BASE64:?}
      NCP_SENS_SERVICE_ID: ${NCP_SENS_SERVICE_ID:?}
      NCP_SENS_ACCESS_KEY: ${NCP_SENS_ACCESS_KEY:?}
      NCP_SENS_SECRET_KEY: ${NCP_SENS_SECRET_KEY:?}
      NCP_SENS_SENDER_NUMBER: ${NCP_SENS_SENDER_NUMBER:?}

      IMAGE_BUCKET: ${IMAGE_BUCKET:?}
      IMAGE_KEY_PREFIX: ${IMAGE_KEY_PREFIX:?}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:?}
      IMAGE_REGION: ${IMAGE_REGION:?}

      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1024m
    init: true

  mysql:
    container_name: classitda-dev-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: classitda
      MYSQL_USER: ${DB_USERNAME:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=192M
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m

  redis:
    container_name: classitda-dev-redis
    image: redis:8.2-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m

volumes:
  mysql-data:
  redis-data:
