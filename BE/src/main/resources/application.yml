spring:
  application:
    name: pheeeew
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  sql:
    init:
      mode: never

logging:
  level:
    # 멱등 저장 경로에서 유니크 제약 위반은 설계된 흐름이다(ADR-0004).
    # 기본 WARN 은 위반한 키 값을 그대로 출력해 기기 식별자가 로그에 남는다.
    org.hibernate.orm.jdbc.error: ERROR

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
