spring:
  application:
    name: classitda
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

auth:
  google:
    web-client-id: ${GOOGLE_OAUTH_WEB_CLIENT_ID}
  jwt:
    private-key-base64: ${AUTH_JWT_PRIVATE_KEY_BASE64}
    public-key-base64: ${AUTH_JWT_PUBLIC_KEY_BASE64}
  token:
    signup-ttl: PT30M
    access-ttl: PT15M
    refresh-ttl: P30D
