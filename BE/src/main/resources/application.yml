spring:
  application:
    name: classitda
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.orm.jdbc.error: "ERROR"

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

auth:
  google:
    web-client-id: ${GOOGLE_OAUTH_WEB_CLIENT_ID}
  phone:
    key-hmac-secret-base64: ${AUTH_PHONE_KEY_HMAC_SECRET_BASE64:}
  sms:
    local:
      fixed-otp: ${AUTH_SMS_LOCAL_FIXED_OTP:}
    sens:
      service-id: ${NCP_SENS_SERVICE_ID:}
      access-key: ${NCP_SENS_ACCESS_KEY:}
      secret-key: ${NCP_SENS_SECRET_KEY:}
      sender-number: ${NCP_SENS_SENDER_NUMBER:}
  jwt:
    private-key-base64: ${AUTH_JWT_PRIVATE_KEY_BASE64}
    public-key-base64: ${AUTH_JWT_PUBLIC_KEY_BASE64}
  token:
    signup-ttl: PT30M
    access-ttl: PT15M
    refresh-ttl: P30D
